name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: renderer/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install renderer dependencies
        run: npm ci --prefix renderer

      - name: Bundle renderer
        run: npm run bundle --prefix renderer

      - name: Renderer smoke test
        run: npm run smoke --prefix renderer

      - name: npm wrapper tests
        run: node --test tests/npm-cli.test.mjs

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Assemble npm packages
        run: node scripts/prepare-npm.mjs --local --pack

      - name: Upload npm tarballs
        uses: actions/upload-artifact@v4
        with:
          name: npm-tarballs-linux
          path: dist/npm/tarballs/*.tgz
          if-no-files-found: error
          retention-days: 7

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: renderer/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install renderer dependencies
        run: npm ci --prefix renderer

      - name: Bundle renderer
        run: npm run bundle --prefix renderer

      - name: Renderer smoke test
        run: npm run smoke --prefix renderer

      - name: npm wrapper tests
        run: node --test tests/npm-cli.test.mjs

      - name: Build release binary
        run: cargo build --release --locked

      - name: Assemble npm packages
        run: node scripts/prepare-npm.mjs --local --pack
