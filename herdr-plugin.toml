id = "excalidraw-tui"
name = "Excalidraw Preview"
version = "0.1.0"
min_herdr_version = "0.7.0"
description = "Live, zero-disk terminal preview for .excalidraw diagrams written by coding agents."
platforms = ["linux", "macos"]

# Open the preview in a session-modal popup. The pane script finds the newest
# .excalidraw file in the workspace (or uses EXV_FILE) and execs exv.
[[panes]]
id = "preview"
title = "Excalidraw Preview"
placement = "popup"
width = "90%"
height = "85%"
command = ["sh", "scripts/herdr-preview.sh"]

[[actions]]
id = "preview"
title = "Preview Excalidraw diagram"
description = "Open the live Excalidraw preview for this workspace in a popup."
contexts = ["workspace"]
command = [
    "sh",
    "-c",
    "exec \"$HERDR_BIN_PATH\" plugin pane open --plugin excalidraw-tui --entrypoint preview",
]
