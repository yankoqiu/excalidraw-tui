[package]
name = "excalidraw-tui"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Preview and convert Excalidraw diagrams in the terminal"
license = "MIT"
repository = "https://github.com/iam-yanko/excalidraw-tui"
readme = "README.md"
categories = ["command-line-utilities", "visualization"]
keywords = ["excalidraw", "tui", "diagram", "terminal", "kitty"]

[[bin]]
name = "exv"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.29"
fontdb = "0.24"
image = { version = "0.25", default-features = false, features = ["png"] }
notify = "8.2"
notify-debouncer-mini = "0.7"
ratatui = "0.30"
ratatui-image = { version = "11", default-features = false, features = ["crossterm"] }
resvg = { version = "0.50", default-features = false, features = ["text", "system-fonts"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
signal-hook = "0.4"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
